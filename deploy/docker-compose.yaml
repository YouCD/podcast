services:
  # PostgreSQL 数据库（应用数据 + pgvector 向量数据）
  # 迁移说明：v13c0c22 起向量库由 Milvus、关系库由 MySQL 统一迁移到 PostgreSQL + pgvector
  postgres:
    container_name: podcast_postgres
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=postgres
      - TZ=Asia/Shanghai
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - podcast-network
  # Dgraph 图数据库
  dgraph:
    image: dgraph/standalone:latest
    container_name: podcast-dgraph
    restart: always
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - dgraph_data:/dgraph
    networks:
      - podcast-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Podcast 应用
  podcast:
    image: docker.cnb.cool/youcd.online/podcast
    container_name: podcast-app
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ./config:/app/config
      - podcast_logs:/var/log/podcast
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      dgraph:
        condition: service_healthy
    networks:
      - podcast-network
    command: ["./podcast", "-f", "config/config.yaml"]

networks:
  podcast-network:
    driver: bridge

volumes:
  postgres_data:
  dgraph_data:
  podcast_logs:
